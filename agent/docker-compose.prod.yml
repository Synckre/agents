services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: agent_app_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: agent_worker_prod
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    command: ["node", "dist/worker.js"]

  ollama:
    image: ollama/ollama:latest
    container_name: agent_ollama_prod
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: agent_ollama_pull_prod
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

volumes:
  ollama_data:

