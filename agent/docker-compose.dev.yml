services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: agent_app_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: agent_worker_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["npx", "tsx", "src/worker.ts"]

  ollama:
    image: ollama/ollama:latest
    container_name: agent_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: agent_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

volumes:
  ollama_data:
