# Coolify (agent only). Postgres lives on Neon — do not run it here.
#
# Resource: Docker Compose
# Base Directory: /agent
# Compose file: docker-compose.coolify.yml
#
# Assign the public domain to the `app` service.
# In Coolify env (required):
#   DATABASE_URL          Neon pooled URI (enable pgvector on the project)
#   LLM_API_KEY, SESSION_SECRET, SYNCKRE_API_KEY
#   CORS_ORIGIN=https://www.synckre.com,https://synckre.com
# Optional: RESEND_*, ERPNEXT_*, GOOGLE_*, EMAIL_FROM, INTERNAL_ALERT_EMAIL

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    exclude_from_hc: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      OLLAMA_BASE_URL: http://ollama:11434
    expose:
      - "3000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    exclude_from_hc: true
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data:
