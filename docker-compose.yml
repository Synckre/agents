# Coolify: Base Directory `/`, Compose file `docker-compose.yml`
# Neon: set DATABASE_URL in Coolify (runtime). Do not run Postgres here.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    exclude_from_hc: true
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]

  app:
    build:
      context: ./agent
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      OLLAMA_BASE_URL: http://ollama:11434
    expose:
      - "3000"
    labels:
      - traefik.http.services.app.loadbalancer.server.port=3000
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  worker:
    build:
      context: ./agent
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    exclude_from_hc: true
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data:
