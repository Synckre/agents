[project]
name = "agent"
version = "0.1.0"
description = "Agente multi-agente LangGraph (supervisor + workers) con DeepSeek, API FastAPI y persistencia Postgres."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "langchain-core==1.5.3",
    "langchain-deepseek==1.1.0",
    "langgraph==1.0.10",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "slowapi==0.1.10",
    "structlog==25.5.0",
    "uvicorn==0.41.0",
    "copilotkit>=0.1.94",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "api"]
[tool.setuptools.package-dir]
"agent" = "src/agent"
"api" = "src/api"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Módulos sin stubs de tipos o con tipos incompletos.
module = [
    "slowapi.*",
    "langgraph.checkpoint.postgres.*",
    "psycopg_pool.*",
    "ag_ui_langgraph.*",
    "ag_ui.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]==0.4.31",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
