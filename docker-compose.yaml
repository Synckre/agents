name: agent_synckre

# Synckre Agent V2 — Enterprise Architecture Compose
# Stack: Frontend (Next.js) + API (FastAPI) + Postgres (pgvector) + Ollama
#
# Coolify: asigna dominio al servicio `frontend` (puerto 3000) y `api` (puerto 8000).
# Healthcheck Path en la UI: /healthz (ambos). Si usas `/` el frontend redirige a Clerk → 503.

services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      - API_URL=${API_URL:-http://api:8000}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      # Coolify usa el sufijo _3000 para saber el puerto del proxy (evita Traefik :80 → 503)
      - SERVICE_FQDN_FRONTEND_3000=${SERVICE_FQDN_FRONTEND_3000:-}
      - SERVICE_URL_FRONTEND_3000=${SERVICE_URL_FRONTEND_3000:-}
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/healthz',(r)=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-production}
      - COMPANY_NAME=${COMPANY_NAME:-Synckre}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph_db}
      - CLERK_ISSUER=${CLERK_ISSUER:-}
      - CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-https://control-ai.synckre.com,http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://localhost:4321,http://127.0.0.1:4321,https://control-ai.synckre.com,https://www.synckre.com,https://synckre.com}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - TOP_K=${TOP_K:-4}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - EMAIL_FROM=${EMAIL_FROM:-soporte@synckre.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-}
      - ERPNEXT_URL=${ERPNEXT_URL:-}
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY:-}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET:-}
      - ERPNEXT_GOOGLE_CALENDAR=${ERPNEXT_GOOGLE_CALENDAR:-}
      - SERVICE_FQDN_API_8000=${SERVICE_FQDN_API_8000:-}
      - SERVICE_URL_API_8000=${SERVICE_URL_API_8000:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/healthz\", timeout=2)'"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
    name: synckre_postgres_data
  ollama_data:
    name: synckre_ollama_data
