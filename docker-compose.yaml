name: agent_synckre

# Synckre Agent V2 — Enterprise Architecture Compose (Telemetry Focus, No Temporal)
# Stack: Frontend (Next.js) + API (FastAPI) + Postgres (pgvector) + Ollama

services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Las NEXT_PUBLIC_* se hornean en el build (producción)
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-pk_test_Y2xldmVyLWZpbmNoLTU1LmNsZXJrLmFjY291bnRzLmRldiQ}
    container_name: synckre_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_URL=${API_URL:-http://api:8000}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: synckre_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-production}
      - COMPANY_NAME=${COMPANY_NAME:-Synckre}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph_db}
      - PUBLIC_API_KEY=${PUBLIC_API_KEY:-synckre-pub-key-2026}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-synckre-int-key-2026}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-synckre-admin-key-2026}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://localhost:4321,http://127.0.0.1:4321}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - TOP_K=${TOP_K:-4}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-resend}
      - EMAIL_FROM=${EMAIL_FROM:-soporte@synckre.com}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-}
      - ERPNEXT_URL=${ERPNEXT_URL:-}
      - ERPNEXT_API_KEY=${ERPNEXT_API_KEY:-}
      - ERPNEXT_API_SECRET=${ERPNEXT_API_SECRET:-}
      - ERPNEXT_GOOGLE_CALENDAR=${ERPNEXT_GOOGLE_CALENDAR:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: synckre_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: synckre_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
    name: synckre_postgres_data
  ollama_data:
    name: synckre_ollama_data
